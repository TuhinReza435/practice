<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="ShortCut icon" href="./assets/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="" />
    <title>Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      font-family: "Outfit", sans-serif;
    }
  </style>
  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10">
      <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <div class="left flex gap-1">
          <div class="w-[60px]">
            <img src="../assets/logo.png" alt="" />
          </div>
          <div class="balance-info">
            <h2 class="text-2xl">$ <span id="balance">45000</span></h2>
            <p class="text-neutral/50">Available Balance</p>
          </div>
        </div>
        <div class="right">
          <a href="../index.html" class="btn btn-soft"
            ><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a
          >
        </div>
      </section>
    </header>

    <section class="w-11/12 mx-auto py-10 space-y-5">
      <h2 class="text-2xl font-bold">
        Welcome to Pay<span class="text-primary">oo</span>
      </h2>
      <p class="text-neutral/50">
        Enjoy easy and convenient financial services with us. Cashout charge is
        low and
      </p>

      <div class="buttons grid grid-cols-3 gap-3">
        <button
         onclick="showOnly('add-money')"
          class="btn btn-primary btn-soft flex-col h-full py-4 items-center r"
        >
          <img src="../assets/opt-1.png" alt="" />
          <p>Add Money</p>
        </button>
        <button
          
          onclick="showOnly('cashout')"
          class="btn btn-primary btn-soft flex-col h-full py-4 items-center r"
        >
          <img src="../assets/opt-1.png" alt="" />
          <p>CashOut</p>
        </button>
        <button
        
          class="btn btn-primary btn-soft flex-col h-full py-4 items-center r"
        >
          <img src="../assets/opt-1.png" alt="" />
          <p>Send Money</p>
        </button>
        <button
          class="btn btn-primary btn-soft flex-col h-full py-4 items-center r"
        >
          <img src="../assets/opt-1.png" alt="" />
          <p>Get Bonus</p>
        </button>
        <button
          class="btn btn-primary btn-soft flex-col h-full py-4 items-center r"
        >
          <img src="../assets/opt-1.png" alt="" />
          <p>Pay Bill</p>
        </button>
        <button
        onclick="showOnly('history')"
          class="btn btn-primary btn-soft flex-col h-full py-4 items-center r"
        >
          <img src="../assets/opt-1.png" alt="" />
          <p>Transactions</p>
        </button>
      </div>
    </section>

    <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-2xl font-bold mb-5">Cashout</h2>
      <div class="form pt-5">
        <div class="card bg-base-100 w-full shadow rounded-2xl">
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label font-bold text-neutral">Agent Number</label>
              <input
                id="agent-number"
                type="text"
                class="input rounded-full bg-base-200 w-full"
                placeholder="Enter 11 digit number"
              /><br />
              <label class="label font-bold text-neutral">Amount</label>
              <input
                id="amount"
                type="number"
                class="input rounded-full bg-base-200 w-full"
                placeholder="Enter ammount to withdraw"
              />
              <br />
              <label class="label font-bold text-neutral">Pin Number</label>
              <input
                id="password"
                maxlength="4"
                minlength="4"
                type="password"
                class="input rounded-full bg-base-200 w-full"
                placeholder="Enter 4 digit pin number"
              />

              <button
                id="cashout-btn"
                class="btn btn-primary rounded-full font-bold mt-4"
              >
                Withdraw Money
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </section>

    <section id="add-money" class="card bg-base-100 w-full shadow rounded-2xl hidden ">
      <h2 class="text-2xl font-bold mb-5">Select a Bank</h2>
        <div >
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label font-bold text-neutral">Select a Bank</label>
             <select id="add-money-bank" class="select input rounded-full bg-base-200 w-full">
             <option disabled selected >Select a Bank</option>
               <option value="DBBL">DBBL</option>
               <option value="IBBL">IBBL</option>
               <option value="City">City</option>
              </select>    
              <br />
              <label class="label font-bold text-neutral"
                >Bank Account Number</label
              >
              <input
                id="bank-account"
                type="number"
                class="input rounded-full bg-base-200 w-full"
                placeholder="Enter 11 digit account number"
              />
              <br />
              <label class="label font-bold text-neutral">Amount to Add</label>
              <input
                id="add-amount"
                type="number"
                class="input rounded-full bg-base-200 w-full"
                placeholder="Add Amount to withdraw"
              />
              <br />
              <label class="label font-bold text-neutral">Pin Number</label>
              <input
                id="pass"
                maxlength="4"
                minlength="4"
                type="password"
                class="input rounded-full bg-base-200 w-full"
                placeholder="Enter 4 digit pin number"
              />

              <button
                id="addmoney-btn"
                class="btn btn-primary rounded-full font-bold mt-4"
              >
                Add Money
              </button>
            </fieldset>
          </div>
        </div>
      
      </div>
    </section>

    <section id="history" class="w-11/12 mx-auto py-10 space-y-5 hidden">
       <h2 class="text-2xl font-bold mb-5">Transactions</h2>
    </section>

    <script src="../script/machine.js"></script>
    <script src="../script/cashout.js"></script>
    <script src="../script/addmoney.js"></script>
  </body>
</html>
